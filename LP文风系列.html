/* ===== 省份分组 + 排序 ===== */

const GROUPS = {};
const GROUPS_COUNTY = {};
P.forEach(x => {
  const base = x.p.replace(/·县$/, '');
  const isCounty = x.p.endsWith('·县');
  if (!GROUPS[base]) GROUPS[base] = [];
  if (!GROUPS_COUNTY[base]) GROUPS_COUNTY[base] = [];
  if (isCounty) GROUPS_COUNTY[base].push(x); else GROUPS[base].push(x);
});
const allGroupKeys = [...new Set([...Object.keys(GROUPS), ...Object.keys(GROUPS_COUNTY)])];
const sortedKeys = allGroupKeys.sort((a,b) => {
  const ia = GROUP_ORDER.indexOf(a), ib = GROUP_ORDER.indexOf(b);
  if (ia >= 0 && ib >= 0) return ia - ib;
  if (ia >= 0) return -1; if (ib >= 0) return 1;
  return a.localeCompare(b, "zh-CN");
});

/* ===== 渲染侧栏 ===== */
const sidebar = document.getElementById('sidebar');
sidebar.innerHTML = `<div class="sec">省份导航</div>` + sortedKeys.map(k => {
  const c = (GROUPS[k]||[]).length + (GROUPS_COUNTY[k]||[]).length;
  return `<a href="#g-${k}" data-prov="${k}"><span>${k}</span><b>${c}</b></a>`;
}).join('');

/* ===== 渲染快速导航 ===== */
const qn = document.getElementById('quicknav');
qn.innerHTML = `<span class="lbl">快速跳转</span>` + sortedKeys.map(k => {
  const c = (GROUPS[k]||[]).length + (GROUPS_COUNTY[k]||[]).length;
  return `<a href="#g-${k}">${k}<b>${c}</b></a>`;
}).join('');

/* ===== 渲染内容区 ===== */
const sections = document.getElementById('sections');
sections.innerHTML = sortedKeys.map(k => {
  const cities = GROUPS[k] || [];
  const counties = GROUPS_COUNTY[k] || [];
  const total = cities.length + counties.length;
  let html = `<div class="section" id="g-${k}" data-prov="${k}">
    <div class="section-header">
      <h2>${k}</h2><span class="en">${k}</span><span class="count">${total}</span>
    </div>`;

  if (cities.length) {
    html += renderBlock(cities, `${k} · 城市`);
  }
  if (counties.length) {
    html += renderBlock(counties, `${k} · 县级地志`);
  }
  html += `</div>`;
  return html;
}).join('');

function renderBlock(items, label) {
  return `<div style="margin-bottom:14px">
    <div style="font-size:11px;color:var(--dim);margin-bottom:6px;letter-spacing:1px">${label}</div>
    <div class="grid active" data-block="${label}">
      ${items.map(x => `
        <a class="card" href="${x.f}" data-f="${x.f}" data-c="${x.c}" data-e="${x.e}" data-t="${x.t}" data-p="${x.p}">
          <div class="row1"><span class="cn">${x.c}</span><span class="en">${x.e}</span></div>
          <div class="tag">${x.t}</div>
          <div class="meta"><span class="prov-tag">${x.p}</span><span class="arrow">→</span></div>
        </a>
      `).join('')}
    </div>
    <div class="list" data-block="${label}">
      ${items.map(x => `
        <a class="list-row" href="${x.f}" data-f="${x.f}" data-c="${x.c}" data-e="${x.e}" data-t="${x.t}" data-p="${x.p}">
          <span class="cn">${x.c}</span><span class="tag">${x.t}</span><span class="prov-tag">${x.p}</span><span class="arrow">→</span>
        </a>
      `).join('')}
    </div>
  </div>`;
}

/* ===== 视图切换 ===== */
function setView(v) {
  document.querySelectorAll('.grid, .list').forEach(el => {
    el.classList.toggle('active', v === 'grid' ? el.classList.contains('grid') : el.classList.contains('list'));
  });
  document.getElementById('btn-grid').classList.toggle('active', v === 'grid');
  document.getElementById('btn-list').classList.toggle('active', v === 'list');
}

/* ===== 搜索过滤 ===== */
const q = document.getElementById('q');
const none = document.getElementById('none');
function doSearch() {
  const s = q.value.trim().toLowerCase();
  let hit = 0;
  document.querySelectorAll('.card, .list-row').forEach(el => {
    const ok = !s ||
      (el.dataset.c||'').toLowerCase().includes(s) ||
      (el.dataset.e||'').toLowerCase().includes(s) ||
      (el.dataset.t||'').toLowerCase().includes(s) ||
      (el.dataset.p||'').toLowerCase().includes(s);
    el.style.display = ok ? '' : 'none';
    if (ok) hit++;
  });
  document.querySelectorAll('.section').forEach(sec => {
    const shown = Array.from(sec.querySelectorAll('[data-f]')).some(el => el.style.display !== 'none');
    sec.style.display = shown ? '' : 'none';
  });
  none.classList.toggle('hide', hit > 0);
}
q.addEventListener('input', doSearch);

/* ===== 侧栏滚动高亮 ===== */
const observer = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      const k = e.target.dataset.prov;
      document.querySelectorAll('.sidebar a').forEach(a => a.classList.toggle('active', a.dataset.prov === k));
    }
  });
}, { rootMargin: '-80px 0px -70% 0px', threshold: 0 });
document.querySelectorAll('.section').forEach(s => observer.observe(s));

/* ===== 随机跳转 ===== */
function goRandom() {
  const x = P[Math.floor(Math.random() * P.length)];
  location.href = x.f;
}

/* ===== 键盘快捷键 ===== */
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space' || e.code === 'KeyR') { e.preventDefault(); goRandom(); }
});
</script>
</body>
</html>
