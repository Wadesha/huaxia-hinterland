  .cta-wrap{background:var(--ink);padding:18px 22px;text-align:center}
  .cta-btn{display:inline-block;background:var(--lp);color:var(--ink);text-decoration:none;
    padding:12px 32px;border-radius:26px;font-weight:700;font-size:16px;letter-spacing:1px;
    transition:background .15s,transform .1s;cursor:pointer;border:0;font-family:inherit}
  .cta-btn:hover{background:#ffc233}
  .cta-btn:active{transform:scale(.97)}
  .cta-info{color:#aaa;font-size:13px;margin-left:14px;letter-spacing:.5px}
  .cta-info b{color:var(--lp)}

  /* Stats row */
  .stats-bar{background:#2a2723;color:var(--muted);padding:14px 22px;display:flex;
    justify-content:center;gap:32px;flex-wrap:wrap;font-size:13px;letter-spacing:1px}
  .stats-bar b{display:block;color:#ddd;font-size:22px;font-family:Georgia,serif;letter-spacing:0}

  /* Container */
  .wrap{max-width:1000px;margin:0 auto;padding:32px 22px 80px}

  /* Group */
  .grp{margin:24px 0 10px;padding-left:12px;border-left:4px solid var(--lp)}
  .grp h2{font-family:"Noto Serif SC",Georgia,serif;font-size:20px;margin:0;color:var(--lp-dk)}
  .grp h2 .en{font-size:13px;color:var(--muted);font-weight:400;font-style:italic;margin-left:8px}

  /* Grid of cards */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:14px}
  .card{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:16px 18px;text-decoration:none;color:var(--ink);
    transition:transform .12s,box-shadow .12s,border-color .12s}
  .card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(28,26,23,.12);border-color:var(--lp)}
  .card h3{margin:0 0 4px;font-family:"Noto Serif SC",Georgia,serif;font-size:18px}
  .card h3 .en{display:block;font-size:12px;color:var(--muted);font-weight:400;
    font-style:italic;margin-top:2px}
  .card .tag{font-size:13px;color:#5a4e3c;margin:6px 0 0}
  .card .meta{display:block;margin-top:10px;font-size:11.5px;letter-spacing:1px;color:var(--lp-dk)}

  .search-bar{position:sticky;top:0;z-index:5;background:var(--ink);padding:12px 22px;display:flex;justify-content:center}

  .empty{display:none;text-align:center;color:var(--muted);padding:36px 0}

  /* Footer */
  footer{padding:24px 22px 60px;text-align:center;color:var(--muted);font-size:12.5px;
    border-top:1px solid var(--line);background:var(--paper)}

  .hide{display:none!important}

/* ===== 去重（publish.ps1 更新 PAGES 时可能产生重复）===== */
const seen = new Set();
const PAGES_UNIQ = PAGES.filter(p => {
  if (seen.has(p.file)) return false;
  seen.add(p.file);
  return true;
});
document.getElementById('total').textContent = PAGES_UNIQ.length;

/* ===== 按省份分组 ===== */
const GROUPS = {};
PAGES_UNIQ.forEach(p => {
  const key = p.prov || "其他";
  if (!GROUPS[key]) GROUPS[key] = [];
  GROUPS[key].push(p);
});
/* 排序：区域总览在最前，然后按省名 */
const ORDER = ["区域总览","山东","河南","河北","山西","陕西","甘肃","湖北","安徽","江苏","其他"];
const groupKeys = Object.keys(GROUPS).sort((a,b) => {
  const ia = ORDER.indexOf(a), ib = ORDER.indexOf(b);
  if (ia >= 0 && ib >= 0) return ia - ib;
  if (ia >= 0) return -1; if (ib >= 0) return 1;
  return a.localeCompare(b, "zh-CN");
});

/* ===== 渲染卡片 ===== */
const wrap = document.getElementById('wrap');
let html = '';
groupKeys.forEach(k => {
  const pages = GROUPS[k];
  html += `<div class="grp" data-group="${k}"><h2>${k} <span class="en">${k} · ${pages.length}</span></h2><div class="grid">`;
  pages.forEach(p => {
    html += `<a class="card" href="${p.file}">
      <h3>${p.cn}<span class="en">${p.en}</span></h3>
      ${p.tag ? `<div class="tag">${p.tag}</div>` : ''}
      <span class="meta">打开阅读 →</span>
    </a>`;
  });
  html += '</div></div>';
});
wrap.innerHTML = html;

const q = document.getElementById('q');
const none = document.getElementById('none');
q.addEventListener('input', () => {
  const s = q.value.trim().toLowerCase();
  let hit = 0;
  PAGES_UNIQ.forEach(p => {
    const el = document.querySelector(`a.card[href="${p.file}"]`);
    if (!el) return;
    const ok = !s || p.cn.toLowerCase().includes(s) || p.en.toLowerCase().includes(s) || p.prov.toLowerCase().includes(s) || (p.tag||'').toLowerCase().includes(s);
    el.style.display = ok ? '' : 'none';
    if (ok) hit++;
  });
  groupKeys.forEach(k => {
    const g = document.querySelector(`.grp[data-group="${k}"]`);
    if (!g) return;
    const shown = Array.from(g.querySelectorAll('.card')).some(c => c.style.display !== 'none');
    g.style.display = shown ? '' : 'none';
  });
  none.style.display = hit ? 'none' : 'block';
});

/* ===== 随机跳转 ===== */
function goRandom() {
  const el = document.getElementById('total');
  if (confirm(`🎲 在 ${PAGES_UNIQ.length} 篇里随机一篇，确认跳转？`)) {
    const p = PAGES_UNIQ[Math.floor(Math.random() * PAGES_UNIQ.length)];
    location.href = p.file;
  }
}

/* ===== 键盘快捷键 ===== */
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space' || e.code === 'KeyR') { e.preventDefault(); goRandom(); }
});
