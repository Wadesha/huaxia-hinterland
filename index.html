<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>华夏腹地 · Hinterland of Huaxia</title>
<style>
  :root{
    --bg:#1c1a17; --surface:#2a2723; --card:#332f29; --card-hover:#3d3831;
    --ink:#f5f0e6; --muted:#a39a8a; --dim:#736b5d;
    --lp:#f2b01e; --lp-dk:#c98a07; --lp-glow:rgba(242,176,30,.15);
    --line:#3d3831; --line-bright:#4a443b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Noto Sans SC","PingFang SC",system-ui,sans-serif;font-size:14px;line-height:1.55}
  a{color:inherit;text-decoration:none}

  /* ===== Top Bar ===== */
  .topbar{position:sticky;top:0;z-index:100;background:rgba(28,26,23,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;gap:14px}
  .logo{font-family:"Noto Serif SC",Georgia,serif;font-size:16px;font-weight:700;letter-spacing:1px;color:var(--lp);white-space:nowrap}
  .logo .sub{color:var(--dim);font-size:11px;font-style:italic;font-weight:400;margin-left:8px}
  .search{flex:1;max-width:360px;position:relative}
  .search input{width:100%;padding:7px 12px 7px 34px;background:var(--surface);border:1px solid var(--line-bright);border-radius:6px;color:var(--ink);font-size:13px;font-family:inherit}
  .search input:focus{outline:none;border-color:var(--lp);box-shadow:0 0 0 2px var(--lp-glow)}
  .search::before{content:"🔍";position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12px;opacity:.6}
  .dice{background:var(--lp);color:var(--bg);border:0;padding:7px 16px;border-radius:6px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:transform .08s,background .15s}
  .dice:hover{background:#ffc233}
  .dice:active{transform:scale(.96)}
  .stat{color:var(--muted);font-size:12px;white-space:nowrap}
  .stat b{color:var(--lp);font-weight:700}

  /* ===== Quick Nav (province anchor links) ===== */
  .quicknav{background:var(--surface);border-bottom:1px solid var(--line);padding:8px 18px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
  .quicknav .lbl{color:var(--dim);font-size:11px;margin-right:6px;text-transform:uppercase;letter-spacing:1px}
  .quicknav a{padding:3px 10px;border-radius:4px;font-size:12px;color:var(--muted);border:1px solid transparent;transition:all .1s}
  .quicknav a:hover{color:var(--lp);border-color:var(--lp);background:var(--lp-glow)}
  .quicknav a b{color:var(--lp-dk);font-weight:400;font-size:10px;margin-left:3px}

  /* ===== Layout: sidebar + content ===== */
  .layout{display:flex;gap:0;min-height:calc(100vh - 98px)}
  .sidebar{width:200px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);padding:16px 0;position:sticky;top:98px;height:calc(100vh - 98px);overflow-y:auto}
  .sidebar .sec{color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:1.5px;padding:0 16px;margin:14px 0 6px}
  .sidebar .sec:first-child{margin-top:0}
  .sidebar a{display:flex;justify-content:space-between;align-items:center;padding:6px 16px;font-size:13px;color:var(--muted);border-left:2px solid transparent;transition:all .12s}
  .sidebar a:hover{color:var(--ink);background:var(--card-hover);border-left-color:var(--lp)}
  .sidebar a b{font-size:11px;color:var(--dim);font-weight:400;font-variant-numeric:tabular-nums}
  .sidebar a.active{color:var(--lp);border-left-color:var(--lp);background:var(--lp-glow)}

  .main{flex:1;padding:20px 24px 60px;min-width:0}

  /* ===== Section ===== */
  .section{margin-bottom:28px}
  .section-header{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .section-header h2{font-family:"Noto Serif SC",Georgia,serif;font-size:17px;color:var(--ink);letter-spacing:.5px}
  .section-header .en{color:var(--dim);font-size:12px;font-style:italic;font-weight:400}
  .section-header .count{margin-left:auto;color:var(--lp);font-size:12px;font-weight:700}

  /* ===== Dense Card Grid ===== */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
  .card{display:flex;flex-direction:column;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:5px;padding:10px 12px;transition:all .12s;cursor:pointer}
  .card:hover{background:var(--card-hover);border-color:var(--lp);box-shadow:0 0 0 1px var(--lp),0 4px 12px rgba(242,176,30,.08);transform:translateY(-1px)}
  .card .row1{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
  .card .cn{font-family:"Noto Serif SC",Georgia,serif;font-size:15px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .en{font-size:10.5px;color:var(--dim);font-style:italic;white-space:nowrap;flex-shrink:0}
  .card .tag{font-size:11.5px;color:var(--muted);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .meta{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
  .card .prov-tag{font-size:10px;color:var(--lp-dk);letter-spacing:.5px}
  .card .arrow{font-size:11px;color:var(--dim);transition:transform .1s}
  .card:hover .arrow{color:var(--lp);transform:translateX(2px)}

  /* ===== List view toggle ===== */
  .viewtoggle{display:flex;gap:4px;background:var(--surface);border-radius:6px;padding:3px;border:1px solid var(--line);margin-left:auto}
  .viewtoggle button{padding:3px 10px;border:0;background:transparent;color:var(--muted);font-size:12px;cursor:pointer;border-radius:4px;font-family:inherit}
  .viewtoggle button.active{background:var(--card);color:var(--lp)}

  /* ===== List view ===== */
  .list{display:none;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:5px;overflow:hidden}
  .list.active{display:flex}
  .grid.active{display:grid}
  .grid:not(.active){display:none}
  .list-row{display:grid;grid-template-columns:100px 1fr 100px 24px;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px;transition:background .1s;cursor:pointer}
  .list-row:last-child{border-bottom:0}
  .list-row:hover{background:var(--card-hover)}
  .list-row .cn{font-weight:700;color:var(--ink)}
  .list-row .en{color:var(--dim);font-style:italic;font-size:11px}
  .list-row .tag{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .list-row .prov-tag{color:var(--lp-dk);font-size:11px}
  .list-row .arrow{color:var(--dim);font-size:12px;text-align:center}
  .list-row:hover .arrow{color:var(--lp)}
  .list-row.hide{display:none}

  /* ===== Empty ===== */
  .empty{text-align:center;color:var(--dim);padding:40px 0;font-size:13px}
  .empty.hide{display:none}

  /* ===== Footer ===== */
  footer{padding:20px 24px;border-top:1px solid var(--line);text-align:center;color:var(--dim);font-size:11.5px;letter-spacing:.3px}
  footer a{color:var(--lp-dk)}
  footer a:hover{color:var(--lp)}

  /* ===== Responsive ===== */
  @media(max-width:900px){
    .sidebar{display:none}
    .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  }
  @media(max-width:600px){
    .topbar{flex-wrap:wrap;gap:8px}
    .search{order:5;max-width:none;width:100%}
    .main{padding:14px}
    .grid{grid-template-columns:repeat(2,1fr);gap:4px}
    .card{padding:8px}
    .list-row{grid-template-columns:70px 1fr 60px 20px;font-size:12px}
    .quicknav a{font-size:11px;padding:2px 6px}
  }

  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:var(--bg)}
  ::-webkit-scrollbar-thumb{background:var(--line-bright);border-radius:4px}
  ::-webkit-scrollbar-thumb:hover{background:var(--lp-dk)}
</style>
</head>

];

/* ===== 去重 ===== */
const seen = new Set();
const P = PAGES.filter(x => { if (seen.has(x.f)) return false; seen.add(x.f); return true; });
document.getElementById('total').textContent = P.length;

/* ===== 省份分组 + 排序 ===== */
const GROUP_ORDER = ["区域总览","山东","河南","河北","山西","陕西","甘肃","湖北","安徽","江苏","其他"];
const GROUPS = {};
const GROUPS_COUNTY = {};
P.forEach(x => {
  const base = x.p.replace(/·县$/, '');
  const isCounty = x.p.endsWith('·县');
  if (!GROUPS[base]) GROUPS[base] = [];
  if (!GROUPS_COUNTY[base]) GROUPS_COUNTY[base] = [];
  if (isCounty) GROUPS_COUNTY[base].push(x); else GROUPS[base].push(x);
});
const allGroupKeys = [...new Set([...Object.keys(GROUPS), ...Object.keys(GROUPS_COUNTY)])];
const sortedKeys = allGroupKeys.sort((a,b) => {
  const ia = GROUP_ORDER.indexOf(a), ib = GROUP_ORDER.indexOf(b);
  if (ia >= 0 && ib >= 0) return ia - ib;
  if (ia >= 0) return -1; if (ib >= 0) return 1;
  return a.localeCompare(b, "zh-CN");
});

/* ===== 渲染侧栏 ===== */
const sidebar = document.getElementById('sidebar');
sidebar.innerHTML = `<div class="sec">省份导航</div>` + sortedKeys.map(k => {
  const c = (GROUPS[k]||[]).length + (GROUPS_COUNTY[k]||[]).length;
  return `<a href="#g-${k}" data-prov="${k}"><span>${k}</span><b>${c}</b></a>`;
}).join('');

/* ===== 渲染快速导航 ===== */
const qn = document.getElementById('quicknav');
qn.innerHTML = `<span class="lbl">快速跳转</span>` + sortedKeys.map(k => {
  const c = (GROUPS[k]||[]).length + (GROUPS_COUNTY[k]||[]).length;
  return `<a href="#g-${k}">${k}<b>${c}</b></a>`;
}).join('');

/* ===== 渲染内容区 ===== */
const sections = document.getElementById('sections');
sections.innerHTML = sortedKeys.map(k => {
  const cities = GROUPS[k] || [];
  const counties = GROUPS_COUNTY[k] || [];
  const total = cities.length + counties.length;
  let html = `<div class="section" id="g-${k}" data-prov="${k}">
    <div class="section-header">
      <h2>${k}</h2><span class="en">${k}</span><span class="count">${total}</span>
    </div>`;

  if (cities.length) {
    html += renderBlock(cities, `${k} · 城市`);
  }
  if (counties.length) {
    html += renderBlock(counties, `${k} · 县级地志`);
  }
  html += `</div>`;
  return html;
}).join('');

function renderBlock(items, label) {
  return `<div style="margin-bottom:14px">
    <div style="font-size:11px;color:var(--dim);margin-bottom:6px;letter-spacing:1px">${label}</div>
    <div class="grid active" data-block="${label}">
      ${items.map(x => `
        <a class="card" href="${x.f}" data-f="${x.f}" data-c="${x.c}" data-e="${x.e}" data-t="${x.t}" data-p="${x.p}">
          <div class="row1"><span class="cn">${x.c}</span><span class="en">${x.e}</span></div>
          <div class="tag">${x.t}</div>
          <div class="meta"><span class="prov-tag">${x.p}</span><span class="arrow">→</span></div>
        </a>
      `).join('')}
    </div>
    <div class="list" data-block="${label}">
      ${items.map(x => `
        <a class="list-row" href="${x.f}" data-f="${x.f}" data-c="${x.c}" data-e="${x.e}" data-t="${x.t}" data-p="${x.p}">
          <span class="cn">${x.c}</span><span class="tag">${x.t}</span><span class="prov-tag">${x.p}</span><span class="arrow">→</span>
        </a>
      `).join('')}
    </div>
  </div>`;
}

/* ===== 视图切换 ===== */
function setView(v) {
  document.querySelectorAll('.grid, .list').forEach(el => {
    el.classList.toggle('active', v === 'grid' ? el.classList.contains('grid') : el.classList.contains('list'));
  });
  document.getElementById('btn-grid').classList.toggle('active', v === 'grid');
  document.getElementById('btn-list').classList.toggle('active', v === 'list');
}

/* ===== 搜索过滤 ===== */
const q = document.getElementById('q');
const none = document.getElementById('none');
function doSearch() {
  const s = q.value.trim().toLowerCase();
  let hit = 0;
  document.querySelectorAll('.card, .list-row').forEach(el => {
    const ok = !s ||
      (el.dataset.c||'').toLowerCase().includes(s) ||
      (el.dataset.e||'').toLowerCase().includes(s) ||
      (el.dataset.t||'').toLowerCase().includes(s) ||
      (el.dataset.p||'').toLowerCase().includes(s);
    el.style.display = ok ? '' : 'none';
    if (ok) hit++;
  });
  document.querySelectorAll('.section').forEach(sec => {
    const shown = Array.from(sec.querySelectorAll('[data-f]')).some(el => el.style.display !== 'none');
    sec.style.display = shown ? '' : 'none';
  });
  none.classList.toggle('hide', hit > 0);
}
q.addEventListener('input', doSearch);

/* ===== 侧栏滚动高亮 ===== */
const observer = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      const k = e.target.dataset.prov;
      document.querySelectorAll('.sidebar a').forEach(a => a.classList.toggle('active', a.dataset.prov === k));
    }
  });
}, { rootMargin: '-80px 0px -70% 0px', threshold: 0 });
document.querySelectorAll('.section').forEach(s => observer.observe(s));

/* ===== 随机跳转 ===== */
function goRandom() {
  const x = P[Math.floor(Math.random() * P.length)];
  location.href = x.f;
}

/* ===== 键盘快捷键 ===== */
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space' || e.code === 'KeyR') { e.preventDefault(); goRandom(); }
});
</script>
